name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sdk:
    name: SDK (lint, typecheck, tests)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install SDK with dev extras
        run: pip3 install -e "sdk[dev]"
      - name: Lint (ruff)
        run: python3 -m ruff check sdk/src sdk/tests
      - name: Tests with coverage
        run: python3 -m pytest sdk/tests -q --cov=paiziq --cov-report=term-missing
      - name: Run examples
        run: |
          PYTHONPATH=sdk/src python3 sdk/examples/happy_path.py
          PYTHONPATH=sdk/src python3 sdk/examples/framework_integrations.py
          PYTHONPATH=sdk/src python3 sdk/examples/payment_agent.py

  ingest:
    name: Ingest service tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install service dependencies (routers evaluate via the SDK engine)
        run: |
          pip3 install -r services/ingest/requirements.txt
          pip3 install -e sdk
      - name: Tests
        working-directory: services/ingest
        run: python3 -m pytest tests/ -q

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [sdk]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip3 install build
          cd sdk && python3 -m build
      - uses: actions/upload-artifact@v4
        with:
          name: paiziq-dist
          path: sdk/dist/
